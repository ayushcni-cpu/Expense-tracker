<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>💸 Expense Tracker</h1>

    <!-- Balance Card -->
    <div class="card balance-card">
      <h3>Total Balance</h3>
      <h2 id="balance">₹0</h2>
    </div>

    <!-- Income & Expense Cards -->
    <div class="summary">
      <div class="card income-card">
        <h4>Income</h4>
        <p id="income">₹0</p>
      </div>
      <div class="card expense-card">
        <h4>Expense</h4>
        <p id="expense">₹0</p>
      </div>
    </div>

    <!-- Add Transaction -->
    <div class="card form-card">
      <h3>Add Transaction</h3>
      <form id="form">
        <input type="text" id="text" placeholder="Description" required>
        <input type="number" id="amount" placeholder="Amount" required>

        <div class="btn-group">
          <button type="button" class="btn income-btn" onclick="addTransaction('income')">
            + Add Income
          </button>
          <button type="button" class="btn expense-btn" onclick="addTransaction('expense')">
            − Add Expense
          </button>
        </div>
      </form>
    </div>

    <!-- Transaction List -->
    <div class="card list-card">
      <h3>History</h3>
      <ul id="list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
